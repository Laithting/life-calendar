<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一生日歷</title>
<meta name="description" content="把一生畫成一格一週的格子，看見此刻在哪裡，提醒自己把握當下。">
<meta name="theme-color" content="#ECEFF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1325" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一生日歷">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  window.LC_STANDALONE = true;
  try{ var p = JSON.parse(localStorage.getItem('lc.prefs') || '{}'); if (p.theme === 'light' || p.theme === 'dark') document.documentElement.setAttribute('data-theme', p.theme); }catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="appName">一生日歷</h1>
      <div class="today" id="todayLine"></div>
    </div>
    <div class="settings">
      <div class="field"><label for="birth" data-i18n="birth">生日</label><input type="date" id="birth"></div>
      <div class="field"><label for="life" data-i18n="life">預期壽命（歲）</label><input type="number" id="life" min="40" max="120" step="1"></div>
      <div class="tbtns">
        <button type="button" class="ghost" id="themeBtn">主題：跟隨系統</button>
        <button type="button" class="ghost" id="langBtn">English</button>
      </div>
    </div>
  </header>

  <div class="example" id="exampleNote" hidden></div>

  <section class="hero">
    <h2 id="heroTitle"></h2>
    <p id="heroSub"></p>
    <div class="reflect" id="reflect"></div>
  </section>

  <div class="main">
    <section class="board">
      <div class="boardhead">
        <div class="seg" role="group">
          <button type="button" id="vw-week" data-view="week" data-i18n="v_week">週</button>
          <button type="button" id="vw-month" data-view="month" data-i18n="v_month">月</button>
          <button type="button" id="vw-year" data-view="year" data-i18n="v_year">年</button>
          <button type="button" id="vw-days" data-view="days" data-i18n="v_days">今年</button>
          <button type="button" id="vw-wall" data-view="wall" data-i18n="v_wall">彩繪牆</button>
        </div>
        <label class="check" id="stageToggleWrap"><input type="checkbox" id="stageToggle"><span data-i18n="showStages">階段上色</span></label>
        <label class="check" id="wallAllWrap" hidden><input type="checkbox" id="wallAll"><span data-i18n="wallAll">顯示整個人生</span></label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint" id="hint"></div>
      <div class="grid" id="grid"></div>
      <div class="info" id="info" aria-live="polite"></div>
    </section>

    <aside class="side">
      <div>
        <h3 data-i18n="now">此刻</h3>
        <div class="countdown" id="countdown"></div>
        <p class="nextcd" id="nextCd" hidden></p>
        <div class="bars">
          <div class="bar b-day"><div class="lbl"><span data-i18n="barDay">今天</span><span id="pDay"></span></div><div class="track"><div class="fill" id="fDay"></div></div></div>
          <div class="bar"><div class="lbl"><span data-i18n="barWeek">本週</span><span id="pWeek"></span></div><div class="track"><div class="fill" id="fWeek"></div></div></div>
          <div class="bar"><div class="lbl"><span id="yearLbl"></span><span id="pYear"></span></div><div class="track"><div class="fill" id="fYear"></div></div></div>
          <div class="bar b-life"><div class="lbl"><span data-i18n="barLife">一生</span><span id="pLife"></span></div><div class="track"><div class="fill" id="fLife"></div></div></div>
        </div>
      </div>

      <div class="weekcard">
        <h3><label for="intent" data-i18n="intentTitle">這一週，我想好好做的一件事</label></h3>
        <input type="text" id="intent" maxlength="80" data-i18n-ph="intentPh">
        <div class="saved" id="intentSaved"></div>
        <div class="thisweek">
          <button type="button" class="tile big" id="twTile" data-i18n-aria="makeTile"></button>
          <div class="tw-body">
            <p id="twText"></p>
            <button type="button" class="linkbtn" id="twBtn"></button>
          </div>
        </div>
        <ul class="past" id="pastIntents"></ul>
      </div>

      <div>
        <h3 data-i18n="convTitle">如果活到預期的歲數，前方大約還有</h3>
        <div class="conv" id="conv"></div>
      </div>
    </aside>
  </div>

  <div class="panels">
    <section class="panel">
      <h3 data-i18n="p_people">和重要的人的時間</h3>
      <p class="desc" data-i18n="p_peopleDesc"></p>
      <form class="form" id="peopleForm">
        <div class="field"><label for="psName" data-i18n="pName">名字</label><input type="text" id="psName" maxlength="30" data-i18n-ph="pNamePh" required></div>
        <div class="field"><label for="psYear" data-i18n="pYear">出生年</label><input type="number" id="psYear" min="1900" max="2100" placeholder="1968" required></div>
        <div class="field"><label for="psFreq" data-i18n="pFreq">多久見一次</label><select id="psFreq"></select></div>
        <button type="submit" class="primary" data-i18n="add">加入</button>
      </form>
      <ul class="list" id="peopleList"></ul>
      <p class="empty" id="peopleEmpty" data-i18n="pEmpty"></p>
    </section>

    <section class="panel">
      <h3 data-i18n="p_stages">人生階段</h3>
      <p class="desc" data-i18n="p_stagesDesc"></p>
      <label class="check"><input type="checkbox" id="stagesOn"><span data-i18n="showStages">階段上色</span></label>
      <ul class="list" id="stageList"></ul>
      <p class="empty" id="stageEmpty" data-i18n="sEmpty"></p>
      <button type="button" class="ghost" id="stagePreset" data-i18n="sPreset"></button>
      <form class="form" id="stageForm">
        <div class="field"><label for="sName" data-i18n="sName">階段名稱</label><input type="text" id="sName" maxlength="20" required></div>
        <div class="field"><label for="sFrom" data-i18n="sFrom">從幾歲</label><input type="number" id="sFrom" min="0" max="130" required></div>
        <div class="field"><label for="sTo" data-i18n="sTo">到幾歲</label><input type="number" id="sTo" min="1" max="130" required></div>
        <div class="field wide"><span class="flabel" data-i18n="sColor">顏色</span><div class="swatches" id="sColor"></div></div>
        <button type="submit" class="primary" data-i18n="add">加入</button>
      </form>
    </section>

    <section class="panel">
      <h3 data-i18n="p_bucket">人生願望清單</h3>
      <p class="desc" id="bucketProgress"></p>
      <form class="form" id="bucketForm">
        <div class="field grow2"><label for="bText" data-i18n="bText">想做的事</label><input type="text" id="bText" maxlength="80" data-i18n-ph="bTextPh" required></div>
        <div class="field"><label for="bAge" data-i18n="bAge">希望幾歲前完成</label><input type="number" id="bAge" min="1" max="130" placeholder="40" required></div>
        <button type="submit" class="primary" data-i18n="add">加入</button>
      </form>
      <ul class="list" id="bucketList"></ul>
      <p class="empty" id="bucketEmpty" data-i18n="bEmpty"></p>
    </section>

    <section class="panel">
      <h3 data-i18n="p_cd">重要日子倒數</h3>
      <form class="form" id="cdForm">
        <div class="field grow2"><label for="cdName" data-i18n="cdName">名稱</label><input type="text" id="cdName" maxlength="40" data-i18n-ph="cdNamePh" required></div>
        <div class="field"><label for="cdDate" data-i18n="cdDate">日期</label><input type="date" id="cdDate" required></div>
        <button type="submit" class="primary" data-i18n="add">加入</button>
      </form>
      <ul class="list" id="cdList"></ul>
      <p class="empty" id="cdEmpty" data-i18n="cdEmpty"></p>
    </section>

    <section class="panel">
      <h3 data-i18n="p_ms">里程碑</h3>
      <form class="form" id="msForm">
        <div class="field"><label for="msDate" data-i18n="msDate">日期</label><input type="date" id="msDate" required></div>
        <div class="field grow2"><label for="msText" data-i18n="msText">名稱</label><input type="text" id="msText" maxlength="40" data-i18n-ph="msPh" required></div>
        <button type="submit" class="primary" data-i18n="add">加入</button>
      </form>
      <ul class="list" id="msList"></ul>
      <p class="empty" id="msEmpty" data-i18n="msEmpty"></p>
    </section>

    <section class="panel">
      <h3 data-i18n="p_data">資料與備份</h3>
      <p class="desc" data-i18n="p_dataDesc"></p>
      <div class="btnrow">
        <button type="button" class="primary" id="exportBtn" data-i18n="exportBtn">下載備份檔</button>
        <button type="button" class="ghost" id="copyBtn" data-i18n="copyBtn">複製備份文字</button>
      </div>
      <p class="note" id="backupState"></p>
      <textarea id="exportText" rows="4" readonly hidden></textarea>
      <h4 data-i18n="importTitle">從備份還原</h4>
      <div class="btnrow">
        <label class="ghost filebtn"><input type="file" id="importFile" accept=".json,application/json"><span data-i18n="importFile">選擇備份檔</span></label>
      </div>
      <label for="importText" class="flabel" data-i18n="importPaste">或貼上備份文字</label>
      <textarea id="importText" rows="3"></textarea>
      <div class="btnrow"><button type="button" class="ghost" id="importCheck" data-i18n="importCheck">檢查這份備份</button></div>
      <div class="confirm" id="importBox" hidden>
        <p id="importSummary"></p>
        <div class="btnrow">
          <button type="button" class="danger" id="importConfirm" data-i18n="importConfirm">確認匯入</button>
          <button type="button" class="ghost" id="importCancel" data-i18n="importCancel">取消</button>
        </div>
      </div>
      <p class="note" id="dataMsg" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h3 data-i18n="p_phone">手機</h3>
      <p class="note" id="installedNote" hidden data-i18n="installed"></p>
      <div id="installHelp">
        <button type="button" class="primary" id="installBtn" hidden data-i18n="installBtn">加到主畫面</button>
        <p class="desc" data-i18n="installIos"></p>
        <p class="desc" data-i18n="installAndroid"></p>
        <p class="desc" data-i18n="installOffline"></p>
      </div>
      <a class="cta" href="widget.html"><span data-i18n="widgetLink">設定手機桌面小工具</span> →</a>
    </section>
  </div>

  <footer data-i18n="footer"></footer>
</div>

<div class="overlay" id="editor" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <div class="sheet-head">
      <h3 id="edTitle"></h3>
      <button type="button" class="x" id="edClose" data-i18n-aria="edClose">×</button>
    </div>
    <div class="ed-body">
      <div class="ed-left">
        <div class="pix" id="edPix"></div>
        <p class="note" data-i18n="edDraw"></p>
        <div class="btnrow">
          <button type="button" class="ghost sm" id="edAuto" data-i18n="edAuto"></button>
          <button type="button" class="ghost sm" id="edInvert" data-i18n="edInvert"></button>
          <button type="button" class="ghost sm" id="edClear" data-i18n="edClear"></button>
        </div>
      </div>
      <div class="ed-right">
        <label for="edText" class="flabel" data-i18n="edText"></label>
        <textarea id="edText" rows="2" maxlength="200" data-i18n-ph="edPh"></textarea>
        <span class="flabel" data-i18n="edMood"></span>
        <div class="moods" id="edMoods"></div>
        <span class="flabel" data-i18n="edPattern"></span>
        <div class="patterns" id="edPatterns"></div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="danger-text" id="edDelete"></button>
      <span class="sp"></span>
      <button type="button" class="ghost" id="edCancel" data-i18n="edCancel"></button>
      <button type="button" class="primary" id="edSave" data-i18n="edSave"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
